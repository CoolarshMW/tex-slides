name: Compile RITS deck

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the supplied source
        run: |
          curl -sSfL https://dvn36104.github.io/session3/_assets/rits-consultation-source.zip -o src.zip
          unzip -q src.zip

      - name: Compile with XeLaTeX (twice)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: rits-consultation-deck.tex
          working_directory: rits-consultation
          latexmk_use_xelatex: true

      - name: Commit the compiled PDF
        run: |
          cp rits-consultation/rits-consultation-deck.pdf .
          rm -rf rits-consultation src.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rits-consultation-deck.pdf
          git commit -m "Add compiled rits-consultation-deck.pdf" || echo "no change"
          git push
